        <a class="brand" href="/"><img src="assets/logo.png" alt="BlueOceanIOT"></a><a href="/">← Back to website</a></header><main class="admin-main"><p class="eyebrow">BLUEOCEANIOT / ADMIN</p><section id="login-panel"><h1>Admin access</h1><p>Sign in to review customer inquiries.</p><form id="login-form"><label>Username<input name="username" autocomplete="username" required maxlength="100"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="button" type="submit">Sign in →</button><p id="login-status" role="status"></p></form></section><section id="inbox-panel" hidden><div class="inbox-heading"><div><h1>Customer inquiries</h1><p id="inquiry-count"></p></div><div class="inbox-actions"><button id="refresh" class="button" type="button">Refresh</button><button id="logout" type="button">Sign out</button></div></div><p id="inbox-status" role="status"></p><div id="submissions"></div></section></main></body></html>
